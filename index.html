<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hướng dẫn Github và VScode</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Core Theme Docsify 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <!-- Theme Add-on Vue (màu sắc giống theme Vue mặc định) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" data-group="addon">

  <!-- Theme Dark (tự động kích hoạt khi hệ điều hành bật chế độ tối) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
    media="(prefers-color-scheme: dark)"
    data-group="addon"
    data-sheet="core-dark-auto"
  >

  <!-- Tùy chỉnh kích thước chữ và độ rộng trang -->
  <style>
    :root {
      /* Tăng cỡ chữ cơ sở lên ~19px (to rõ dễ đọc) */
      --font-size: 19px;

      /* Giới hạn chiều rộng bài viết gọn gàng, căn giữa trang */
      --content-max-width: 850px;
    }
  </style>
</head>
<body class="sidebar-toggle-chevron sidebar-chevron-right sidebar-group-box">
  <div id="app">Đang tải...</div>
  <script>
    window.$docsify = {
      name: 'Danh sách trang', // Tên hiển thị trên góc trái
      repo: '', // Có thể điền link repo GitHub nếu muốn hiển thị icon góc phải
      loadSidebar: true, // Bật sidebar
      subMaxLevel: 3,    // Tự gom các thẻ h2, h3 trong bài viết vào mục lục
      search: 'auto'     // Bật ô tìm kiếm
    }
  </script>
  <!-- Các script thư viện chạy trực tiếp qua CDN (Docsify v5) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>
</html>
